# Publish a release when a version tag is pushed.
#
#   push of a tag vX.Y.Z:  static build, the tests that need no display, the
#                          macOS app (Apple Silicon) tested without Homebrew,
#                          then a GitHub release with lilyterm-x86_64, the
#                          tarball, LilyTerm-VERSION-macos-arm64.dmg and
#                          SHA256SUMS
#   workflow_dispatch:     the same builds and tests, without a release (to try
#                          a branch: Actions > build > Run workflow)
#
# Every change is built and tested on Gitea first (.gitea/workflows/build.yml,
# with the X11 and Wayland tests); the same commits come here once they passed
# there. So GitHub only builds what it releases.
#
# The compiled dependencies (GLib, GTK+, VTE, ...) are kept as a build cache in
# the GitHub container registry, ghcr.io/OWNER/lilyterm-buildcache. Unlike the
# Actions cache it is shared by all branches and tags and never expires, so
# they are only compiled again when docker/Dockerfile.static itself changes.
# A normal run then takes a few minutes.
#
# The X11 and Wayland tests run on Gitea, not here: on the shared runners their
# key presses get lost now and then. BACKENDS= turns them off.
#
# To release: set VERSION in .default, commit, then
#   git tag v$(sed -n 's/^VERSION = //p' .default) && git push origin --tags

name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The static binary: build, test in a clean image, package
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^VERSION = //p' .default)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          # A release must say the same version as the binary does with -v
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but VERSION in .default is $version (expected the tag v$version)."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4
      - name: Build cache location
        id: cache
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lilyterm-buildcache" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # GLib, GTK+, VTE, ... only compile when docker/Dockerfile.static changes:
      # their layers come back from the registry cache otherwise.
      - name: Build the static binary and its test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.static
          target: test
          tags: lilyterm-static-test
          load: true
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}:static
          cache-to: type=registry,ref=${{ steps.cache.outputs.ref }}:static,mode=max

      - name: Test the static binary (the tests that need no display)
        run: |
          mkdir -p test-output
          docker run --rm -e GITHUB_ACTIONS -e BACKENDS= -v "$PWD/test-output":/tmp/test-output lilyterm-static-test

      - name: Keep the logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-static
          path: test-output
          if-no-files-found: ignore

      - name: Export the binary and its data files
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.static
          target: export
          outputs: type=local,dest=dist
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}:static

      - name: Package
        env:
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.epoch }}
        run: |
          chmod +x dist/lilyterm
          docker/package.sh dist release
          ./release/lilyterm-x86_64 -v

      - uses: actions/upload-artifact@v7
        with:
          name: lilyterm-${{ steps.version.outputs.version }}-linux-x86_64
          path: release/
          if-no-files-found: error

  # The macOS app: GTK+ 3 and VTE from Homebrew, copied into LilyTerm.app
  # (macos/bundle-app.sh), tested with Homebrew moved away (macos/test-app.sh)
  macos:
    runs-on: macos-15   # Apple Silicon; macos-latest got no runner (2026-10-19)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        run: echo "version=$(sed -n 's/^VERSION = //p' .default)" >> "$GITHUB_OUTPUT"

      - name: Install GTK+ 3, VTE and the build tools
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: brew install gtk+3 vte3 librsvg adwaita-icon-theme pkgconf gettext

      # The same certificate for every release: macOS keeps the permissions it
      # gave LilyTerm (Local Network: ssh to a computer at home). Without the
      # secrets (a fork) the app is signed ad hoc, as before.
      - name: Import the signing certificate
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          if [ -z "$MACOS_SIGN_P12" ]; then
            echo "No MACOS_SIGN_P12 secret: the app is signed ad hoc"
            exit 0
          fi
          kc=$RUNNER_TEMP/signing.keychain-db
          kc_password=$(openssl rand -hex 16)
          security create-keychain -p "$kc_password" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_password" "$kc"
          echo "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$MACOS_SIGN_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_password" "$kc" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # self-signed: trusted for code signing on this runner only
          security find-certificate -c "LilyTerm (ebal) Code Signing" -p "$kc" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          security find-identity -v -p codesigning "$kc"
          echo "SIGN_IDENTITY=LilyTerm (ebal) Code Signing" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Build LilyTerm.app and the .dmg
        run: macos/bundle-app.sh release

      - name: Test the app without Homebrew
        run: macos/test-app.sh release/LilyTerm-${{ steps.version.outputs.version }}-macos-arm64.dmg test-output

      - name: Keep the log and screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-macos
          path: test-output
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: lilyterm-${{ steps.version.outputs.version }}-macos-arm64
          path: release/*.dmg
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [static, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lilyterm-*-*-*
          path: release
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          dmg=$(ls LilyTerm-*-macos-arm64.dmg)
          sha256sum "$dmg" >> SHA256SUMS
          tarball=$(ls lilyterm-*-linux-x86_64.tar.gz)
          base=https://github.com/$GH_REPO/releases/download/$TAG
          cat > ../notes.md << EOF
          LilyTerm for Linux x86_64, as one static binary with GTK+ 3 and VTE linked in
          (it runs on X11 and on Wayland, and needs no library from your system), and for
          macOS on Apple Silicon, as an app with GTK+ 3 and VTE inside.

          ### Linux: just run it

          \`\`\`sh
          curl -L -o lilyterm $base/lilyterm-x86_64
          chmod +x lilyterm
          ./lilyterm
          \`\`\`

          ### Linux: install it, with a menu entry, icon and man page

          \`\`\`sh
          curl -LO $base/$tarball
          tar xzf $tarball
          cd ${tarball%.tar.gz}
          ./install.sh          # for you, in ~/.local   (sudo ./install.sh: for everyone, in /usr/local)
          \`\`\`

          ### macOS (Apple Silicon)

          Download [$dmg]($base/$dmg), open it and drag LilyTerm to Applications.
          LilyTerm is not signed by Apple, so macOS refuses to open it the first time.
          Run this once in Terminal:

          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/LilyTerm.app
          \`\`\`

          ### Checksums (SHA-256)

          \`\`\`
          $(cat SHA256SUMS)
          \`\`\`
          EOF
          gh release create "$TAG" --verify-tag --title "LilyTerm ${TAG#v}" --notes-file ../notes.md \
            lilyterm-x86_64 "$tarball" "$dmg" SHA256SUMS
